<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>App do garçom · BoraLanchar!</title>
<meta name="theme-color" content="#1A1112">
<link rel="icon" href="/assets/brand/boralanchar-icone-app.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<link rel="stylesheet" href="/assets/garcom.css?v=2">
</head>
<body>

<!-- ENTRAR -->
<section class="g-login" id="v-login" hidden>
  <div class="g-card">
    <div class="g-brand"><img id="lg-logo" alt="" hidden><span id="lg-ini">B</span></div>
    <h1 id="lg-store">App do garçom</h1>
    <p class="g-muted">Digite o seu PIN para entrar.</p>
    <div class="pin" id="pin" aria-live="polite"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="keys" id="keys">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="del" aria-label="Apagar">⌫</button><button type="button" data-k="0">0</button><button type="button" data-k="ok" class="ok">Entrar</button>
    </div>
    <p class="g-err" id="lg-err" role="alert"></p>
  </div>
</section>

<!-- MESAS -->
<section id="v-tables" hidden>
  <header class="g-top">
    <div><b id="tp-store"></b><small id="tp-who"></small></div>
    <button class="g-btn ghost" type="button" id="logout">Sair</button>
  </header>
  <main class="g-main">
    <div class="g-head"><h1 id="tp-title">Mesas</h1><button class="g-btn ghost" type="button" id="refresh">Atualizar</button></div>
    <div class="g-kind" id="g-kind" role="group" aria-label="Mostrar" hidden><button type="button" data-kind="mesa" aria-pressed="true">Mesas</button><button type="button" data-kind="comanda" aria-pressed="false">Comandas</button></div>
    <div class="t-grid" id="t-grid"></div>
  </main>
</section>

<!-- MESA -->
<section id="v-table" hidden>
  <header class="g-top">
    <button class="g-btn ghost" type="button" id="back" aria-label="Voltar para as mesas">← Voltar</button>
    <b id="tb-title"></b>
    <span></span>
  </header>
  <nav class="g-tabs" role="tablist">
    <button type="button" role="tab" data-gt="pedir" aria-selected="true">Lançar pedido</button>
    <button type="button" role="tab" data-gt="conta" aria-selected="false">Conta <b id="tb-total"></b></button>
  </nav>
  <main class="g-main" id="p-pedir">
    <div class="g-search"><input id="q" type="search" placeholder="Buscar no cardápio"></div>
    <div id="menu"></div>
  </main>
  <main class="g-main" id="p-conta" hidden>
    <div id="bill"></div>
  </main>
  <div class="g-bar" id="bar" hidden>
    <button class="g-btn primary" type="button" id="send"><span id="send-txt">Enviar para a cozinha</span><span id="send-total"></span></button>
  </div>
</section>

<div class="state" id="v-state"><p id="st-text">Carregando…</p></div>

<dialog id="d-opt"><form method="dialog" class="g-sheet" id="opt-form"></form></dialog>
<dialog id="d-send"><form class="g-sheet" id="send-form" novalidate></form></dialog>
<dialog id="d-close"><form class="g-sheet" id="close-form" novalidate></form></dialog>
<dialog id="d-open"><form class="g-sheet" id="open-form" novalidate></form></dialog>
<div class="toast" role="status" aria-live="polite"></div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script defer src="/assets/config.js"></script>
<script defer src="/assets/garcom.js?v=3"></script>
</body>
</html>
